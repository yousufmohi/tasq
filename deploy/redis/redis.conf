# taskq Redis configuration. See docs/DESIGN.md §4 and §8.

# Eviction would silently delete job hashes and streams. With noeviction,
# writes fail loudly instead. Workers refuse to start on any other policy.
maxmemory-policy noeviction

# AOF, fsync once per second: up to ~1s of acknowledged writes can be lost
# on a crash of this node. Use WAITAOF per enqueue, or appendfsync always,
# to narrow that (measured in the failure tests and benchmarks).
appendonly yes
appendfsync everysec
save ""

# Bounds split-brain writes on an isolated primary when replicas exist.
# Harmless with no replicas configured (0 disables the check).
min-replicas-to-write 0
min-replicas-max-lag 10
